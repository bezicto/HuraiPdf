name: PHP compatibility

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4', '8.5']

    name: PHP ${{ matrix.php-version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: ctype, mbstring, zlib, openssl
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Check PHP syntax
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l && php -l index.php

      - name: Run regression suite
        run: php tests/run.php

      - name: Run without optional encoding functions
        run: php -d disable_functions=mb_convert_encoding,mb_list_encodings,iconv tests/run.php

      - name: Verify missing OpenSSL handling
        run: php -d disable_functions=openssl_get_cipher_methods,openssl_encrypt,openssl_decrypt tests/missing_openssl.php
